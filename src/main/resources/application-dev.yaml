# ========== 支付配置 ==========
pay:
  # 通用配置
  connect-timeout: 3000
  read-timeout: 5000

  # 支付宝配置
  alipay:
    # 沙箱环境：true，正式环境：false
    sandbox-enabled: true
    # 应用ID（沙箱/正式）
    app-id: 9021000166629741
    # 商户私钥（PKCS8格式，去除头尾和换行）
    private-key: 
    # 支付宝公钥（从沙箱控制台获取）
    alipay-public-key: 
    # 签名类型，默认 RSA2
    sign-type: RSA2
    # 通知回调地址（公网可访问）
    notify-url:  https://discrimination-deutschland-rates-grande.trycloudflare.com/api/payment/callback/alipay
    # 🔥 关键：沙箱网关地址
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # 连接超时（毫秒）
    connect-timeout: 3000
    # 读取超时（毫秒）
    read-timeout: 5000
    seller-id: 2088721106603765

  # 微信配置
  wechat:
    # 是否启用沙箱环境（true=沙箱，false=正式）
    sandbox-enabled: true
    # 基础 API 地址（正式或沙箱）
    api-base-url: https://api.mch.weixin.qq.com
    # 商户号
    mchid: 1230000109
    # 商户 AppID（公众号/小程序）
    appid: wx1234567890abcdef
    # API V3 密钥（32位字符串）
    api-v3-key: your-api-v3-key-here-32bytes
    # 证书序列号（用于V3签名，可选）
    serial-no: 1234567890ABCDEF
    # 回调通知地址（公网可访问）
    notify-url: https://your-domain.com/api/payment/callback
    # 连接超时（毫秒）
    connect-timeout: 3000
    # 读取超时（毫秒）
    read-timeout: 5000
    # 沙箱环境专用密钥（由微信提供，可通过 getsignkey 获取）
    sandbox-sign-key: your-sandbox-sign-key
  refund:
    max-query-retry: 5
    query-interval-seconds: 300
    compensate-batch-size: 100
  # 其他支付配置...
