# ============================================================
# 开发环境配置（覆盖公共配置）
# ============================================================
spring:
  devtools:
    restart:
      enabled: true

  # 本地 RabbitMQ（覆盖环境变量）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# 日志级别（开发环境更详细）
logging:
  level:
    com.mall: DEBUG
    com.mall.audit: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO

# 支付配置（开发环境使用沙箱）
pay:
  alipay:
    sandbox-enabled: true
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # 以下值从环境变量读取，但可以在这里写默认值（方便本地调试）
    app-id: ${ALIPAY_APP_ID:9021000166629741}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    seller-id: ${ALIPAY_SELLER_ID:2088721106603765}
    notify-url: ${ALIPAY_NOTIFY_URL:https://discrimination-deutschland-rates-grande.trycloudflare.com/api/payment/callback/alipay}
    connect-timeout: 3000
    read-timeout: 5000

  wechat:
    sandbox-enabled: true
    api-base-url: https://api.mch.weixin.qq.com
    mchid: ${WECHAT_MCHID:1230000109}
    appid: ${WECHAT_APPID:wx1234567890abcdef}
    api-v3-key: ${WECHAT_API_V3_KEY:your-api-v3-key-here-32bytes}
    serial-no: ${WECHAT_SERIAL_NO:1234567890ABCDEF}
    notify-url: ${WECHAT_NOTIFY_URL:https://your-domain.com/api/payment/callback}
    connect-timeout: 3000
    read-timeout: 5000
    sandbox-sign-key: ${WECHAT_SANDBOX_SIGN_KEY:your-sandbox-sign-key}

# 开发环境启用钉钉（可选）
dingtalk:
  enabled: ${DINGTALK_ENABLED:true}
  webhook-url: ${DINGTALK_WEBHOOK_URL:https://oapi.dingtalk.com/robot/send?access_token=596cf58a0c070f77c5edbd9b5c1cd6ec84d6f37bb30c7e6ac8eebc7b97df68c8}
  secret: ${DINGTALK_SECRET:SECed9bd42d0ef90d4f3da8849609a6fe08827b4a55cc24673f266ee142bb56d4d9}

# 开发环境开启调用链日志
call:
  seq:
    enabled: true
    # ============================================================
