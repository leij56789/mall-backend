spring:
  application:
    name: mall-backend
#    mq手动确认
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    # HikariCP 监控配置
    hikari:
      register-mbeans: true

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  devtools:
    restart:
      enabled: false
#    livereload:
#      enablid:false
  # Redisson 独立配置（可选，也可以复用上面的 Redis 配置）
#redisson:
#  config:
#    singleServerConfig:
#      address: "redis://localhost:6379"
#      database: 0
#      password: null
#      connectionPoolSize: 64
#      connectionMinimumIdleSize: 10
#      timeout: 5000

  # RabbitMQ 配置（已注释）
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: guest
  #   password: guest
  #   virtual-host: /
  #   publisher-confirm-type: correlated
  #   publisher-returns: true
  #   listener:
  #     simple:
  #       acknowledge-mode: auto
  #       concurrency: 5
  #       max-concurrency: 10

  # Jackson 时间序列化配置
#  jackson:
#    date-format: yyyy-MM-dd HH:mm:ss
#    time-zone: GMT+8
#    serialization:
#      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.realworld.blog.entity

# 日志配置
logging:
  level:
    com.mall: INFO
    com.mall.audit: DEBUG
    org:
      springframework:
        web: INFO
        boot: INFO
#logging:
#  level:
#    # ===== 你自己的项目 =====
#    com.mall: INFO                              # 项目整体：INFO
#    com.mall.pay: DEBUG                         # 支付模块：DEBUG
#    com.mall.pay.audit: DEBUG                   # 审计映射器：DEBUG（你需要的）
#    com.mall.aspect: DEBUG                      # 切面日志：DEBUG
#    com.mall.job: INFO                          # 定时任务：INFO（避免日志刷屏）
#    com.mall.mq: INFO                           # 消息队列：INFO
#    com.mall.mapper: WARN                       # MyBatis Mapper：WARN（除非要看SQL）
#    com.mall.controller: INFO                   # Controller：INFO（看请求入口就够了）
#
#    # ===== 第三方框架 =====
#    org.springframework.web: INFO               # Spring Web：INFO
#    org.springframework.boot: INFO              # Spring Boot：INFO
#    org.springframework.transaction: INFO       # 事务：INFO
#    org.springframework.scheduling: WARN        # 调度器：WARN（减少噪音）
#
#    # ===== 支付宝 SDK =====
#    com.alipay: WARN                            # 支付宝SDK：WARN（太多DEBUG日志）
#    sdk.biz: WARN                               # 支付宝业务日志：WARN
#    sdk.comm: WARN                              # 支付宝通信日志：WARN
#编号日志
call:
  seq:
    enabled: true   # 本地调试开启，提交时改为 false
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%X{userId}] %-5level %logger{36} - %msg%n"
# 打印 SQL 日志（根据实际包名调整）
    # com.yourcompany.demo.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/blog.log

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true

# 分布式ID配置（Snowflake）
snowflake:
  worker-id: 1
  datacenter-id: 1
hutool:
  snowflake:
    worker-id: 1        # 每个实例必须不同，范围 0-31
    data-center-id: 1   # 每个实例必须不同，范围 0-31
#mq数据配置
mall:
  message:
    # 重试间隔（分钟）
    retry-interval-minutes: 5
    # 最大重试次数
    max-retry: 3
    # 首次重试延迟（秒）
    initial-retry-delay-seconds: 30
    # 补偿批量大小
    compensate-batch-size: 100
    #    延迟时间
    delay-time: 10000
    seckill-delay-time: 30000
    initial-retry-count: 0
    time-tolerance-ms: 2000ms
    payment-order-delay-time-s: 1000s
  # 数据中心ID
  compensate:
    lock-key-timeout-seconds: 60
    order-timeout-compensate-fixed-delay: 30000
    message-compensate-fixed-delay: 20000
    pending-long-minutes: 5
    pending-too-long-minutes: 30

