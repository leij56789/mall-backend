# ============================================================
# 生产环境配置（覆盖公共配置）
# ============================================================
spring:
  # 生产环境关闭 DevTools
  devtools:
    restart:
      enabled: false

# 日志级别（生产环境只打 WARN 及以上）
logging:
  level:
    com.mall: WARN
    com.mall.job: INFO
    com.mall.pay: INFO
    org.springframework.web: WARN
    org.springframework.boot: WARN

# 支付配置（正式环境）
pay:
  connect-timeout: 5000
  read-timeout: 10000

  alipay:
    sandbox-enabled: false
    app-id: ${ALIPAY_APP_ID}
    private-key: ${ALIPAY_PRIVATE_KEY}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY}
    gateway-url: https://openapi.alipay.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL}  # 无默认值，必须通过环境变量注入
    seller-id: ${ALIPAY_SELLER_ID}
    connect-timeout: 5000
    read-timeout: 10000

  wechat:
    sandbox-enabled: false
    api-base-url: https://api.mch.weixin.qq.com
    mchid: ${WECHAT_MCHID}
    appid: ${WECHAT_APPID}
    api-v3-key: ${WECHAT_API_V3_KEY}
    serial-no: ${WECHAT_SERIAL_NO}
    notify-url: ${WECHAT_NOTIFY_URL}  # 无默认值，必须通过环境变量注入
    connect-timeout: 5000
    read-timeout: 10000
    sandbox-sign-key: ${WECHAT_SANDBOX_SIGN_KEY}  # 生产环境通常为空

  refund:
    max-query-retry: 5
    query-interval-seconds: 300
    compensate-batch-size: 50

# 钉钉告警（生产环境必须启用）
dingtalk:
  enabled: ${DINGTALK_ENABLED:true}
  webhook-url: ${DINGTALK_WEBHOOK_URL}
  secret: ${DINGTALK_SECRET}

# 生产环境关闭调用链日志（或按需开启）
call:
  seq:
    enabled: false

# Actuator 生产环境建议限制 IP（通过 Spring Security 或防火墙）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      # 生产环境建议通过网关层限制访问，此处不配置 IP 白名单